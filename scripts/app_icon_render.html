<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 512px;
    height: 512px;
  }
  .icon-box {
    width: 512px;
    height: 512px;
    border-radius: 112px;
    background: #0A0912;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bird {
    width: 360px;
    height: 360px;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div class="icon-box">
    <img src="../public/basedly-bird.svg" class="bird" />
  </div>
</body>
</html>
