<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0912;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .title-area {
    text-align: center;
    margin-bottom: 40px;
  }
  .title-area h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    color: #FBF7EE;
  }
  .title-area p {
    font-size: 15px;
    color: #94A3B8;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    width: 100%;
    max-width: 1200px;
  }
  .card {
    background: #14121E;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .num {
    background: rgba(217, 119, 87, 0.25);
    color: #F0A288;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid rgba(217, 119, 87, 0.5);
  }
  .header h3 {
    font-size: 18px;
    font-weight: 700;
    color: #FBF7EE;
    letter-spacing: -0.02em;
  }
  .canvas-container {
    background: radial-gradient(circle at 50% 40%, #1A1726 0%, #0D0B14 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
  }
  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .desc {
    font-size: 13.5px;
    color: #94A3B8;
    line-height: 1.45;
    flex: 1;
  }
  .wordmark-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    margin-left: 16px;
  }
  .wordmark-tag span {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #FBF7EE;
  }
</style>
</head>
<body>
  <div class="title-area">
    <h1>3D Voxel Pixel Art Otter Mascots</h1>
    <p>High-resolution isometric 3D voxel art companions with dimensional lighting & tactile depth</p>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const PALETTE = {
      'T': { top: '#F0A288', left: '#D97757', right: '#A25438' }, // Terracotta
      'H': { top: '#F7C4B2', left: '#E89274', right: '#BD684E' }, // Highlight
      'S': { top: '#A25438', left: '#8B4127', right: '#5C2210' }, // Dark Shadow
      'C': { top: '#FFFFFF', left: '#FDF8EE', right: '#D8CEBE' }, // Cream tummy/snout
      'B': { top: '#2C2724', left: '#18181B', right: '#0A0908' }, // Outline / Eyes
      'W': { top: '#FFFFFF', left: '#F8FAFC', right: '#E2E8F0' }, // Eye catchlight
      'P': { top: '#FDA4AF', left: '#FB7185', right: '#E11D48' }, // Pink blush
      'G': { top: '#FDE047', left: '#FBBF24', right: '#D97706' }, // Gold Stone / Star
    };

    // Draw single 3D isometric voxel cube
    function drawVoxel(ctx, x, y, size, type) {
      const p = PALETTE[type] || PALETTE['T'];
      const h = size * 0.577; // tan(30 deg)

      // Top Face
      ctx.fillStyle = p.top;
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x - size, y);
      ctx.closePath();
      ctx.fill();

      // Left Face
      ctx.fillStyle = p.left;
      ctx.beginPath();
      ctx.moveTo(x - size, y);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + h + size);
      ctx.lineTo(x - size, y + size);
      ctx.closePath();
      ctx.fill();

      // Right Face
      ctx.fillStyle = p.right;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x + size, y + size);
      ctx.lineTo(x, y + h + size);
      ctx.closePath();
      ctx.fill();

      // Subtle edge line
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Render a 3D voxel model sorted by isometric depth (x + y + z)
    function renderModel(canvas, voxels, voxelSize = 14, offsetX = 0, offsetY = 0) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sort back-to-front (depth order: x + y + z)
      voxels.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));

      const cx = canvas.width / 2 + offsetX;
      const cy = canvas.height / 2 + offsetY;

      // Draw soft ambient shadow under character
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + 90, 85, 32, 0, 0, Math.PI * 2);
      ctx.fill();

      for (const [vx, vy, vz, type] of voxels) {
        // Isometric projection formulas
        const isoX = cx + (vx - vy) * voxelSize;
        const isoY = cy + (vx + vy) * (voxelSize * 0.5) - vz * (voxelSize * 0.9);
        drawVoxel(ctx, isoX, isoY, voxelSize, type);
      }
    }

    // --- MODEL 1: Standing 3D Voxel Chibi Otter ---
    function buildModel1() {
      const v = [];
      // Feet (z = 0)
      for (let x = -3; x <= -1; x++) for (let y = -2; y <= 1; y++) v.push([x, y, 0, 'S']);
      for (let x = 1; x <= 3; x++) for (let y = -2; y <= 1; y++) v.push([x, y, 0, 'S']);

      // Body (z: 1 to 5)
      for (let z = 1; z <= 5; z++) {
        for (let x = -3; x <= 3; x++) {
          for (let y = -3; y <= 2; y++) {
            let type = 'T';
            // Cream belly on front
            if (y >= 1 && Math.abs(x) <= 2 && z >= 1 && z <= 4) type = 'C';
            v.push([x, y, z, type]);
          }
        }
      }
      // Paws held in front (z: 3, y: 3)
      v.push([-1, 3, 3, 'H'], [0, 3, 3, 'H'], [1, 3, 3, 'H']);

      // Head (z: 6 to 10)
      for (let z = 6; z <= 10; z++) {
        for (let x = -4; x <= 4; x++) {
          for (let y = -3; y <= 3; y++) {
            let type = 'T';
            // Cream snout (z: 6..7, y: 3, |x| <= 2)
            if (y === 3 && z >= 6 && z <= 7 && Math.abs(x) <= 2) type = 'C';
            v.push([x, y, z, type]);
          }
        }
      }

      // Nose
      v.push([0, 4, 7, 'B']);

      // Eyes
      v.push([-2.5, 3.5, 8, 'B'], [-2.5, 3.5, 9, 'B'], [-2.5, 3.5, 9.2, 'W']);
      v.push([2.5, 3.5, 8, 'B'], [2.5, 3.5, 9, 'B'], [2.5, 3.5, 9.2, 'W']);

      // Blush
      v.push([-3.5, 3.5, 6.5, 'P'], [3.5, 3.5, 6.5, 'P']);

      // Ears (z: 11..12, x: -3.5, 3.5)
      for (let z = 11; z <= 12; z++) {
        v.push([-3, 0, z, 'T'], [-3, 1, z, 'T']);
        v.push([3, 0, z, 'T'], [3, 1, z, 'T']);
      }

      // Tail extending to side-back
      v.push([0, -4, 1, 'S'], [1, -5, 2, 'T'], [2, -5, 3, 'H']);
      return v;
    }

    // --- MODEL 2: 3D Voxel Holding Glowing Star ---
    function buildModel2() {
      const v = buildModel1();
      // Glowing Star in hands (x: 0, y: 4, z: 3.5)
      v.push([0, 4, 3, 'G'], [0, 4, 4, 'G'], [-1, 4, 3.5, 'G'], [1, 4, 3.5, 'G'], [0, 4.5, 3.5, 'W']);
      return v;
    }

    // --- MODEL 3: 3D Voxel Floating Swimming Otter ---
    function buildModel3() {
      const v = [];
      // Horizontal swimming body (z: 1..3, x: -3..3, y: -6..4)
      for (let z = 1; z <= 3; z++) {
        for (let x = -3; x <= 3; x++) {
          for (let y = -5; y <= 3; y++) {
            let type = 'T';
            if (z === 3 && Math.abs(x) <= 2 && y >= -2 && y <= 2) type = 'C';
            v.push([x, y, z, type]);
          }
        }
      }
      // Floating head (y: 3..7, z: 2..6, x: -4..4)
      for (let z = 2; z <= 6; z++) {
        for (let x = -3; x <= 3; x++) {
          for (let y = 3; y <= 6; y++) {
            let type = 'T';
            if (z >= 3 && z <= 4 && y === 6 && Math.abs(x) <= 2) type = 'C';
            v.push([x, y, z, type]);
          }
        }
      }
      // Nose & Eyes
      v.push([0, 7, 4, 'B']);
      v.push([-2, 6.5, 5, 'B'], [2, 6.5, 5, 'B']);
      // Ears
      v.push([-3, 4, 7, 'T'], [3, 4, 7, 'T']);
      // Paws folded on chest
      v.push([-1, 0, 4, 'H'], [0, 0, 4, 'H'], [1, 0, 4, 'H']);
      // Back feet flippers
      v.push([-3, -6, 2, 'T'], [3, -6, 2, 'T']);
      // Tail
      v.push([0, -7, 2, 'T'], [0, -8, 2.5, 'H']);
      return v;
    }

    // --- MODEL 4: 3D Voxel Otter Badge with Little Paws ---
    function buildModel4() {
      const v = [];
      // Large head (z: 2 to 7)
      for (let z = 2; z <= 7; z++) {
        for (let x = -4; x <= 4; x++) {
          for (let y = -3; y <= 3; y++) {
            let type = 'T';
            if (y === 3 && z >= 2 && z <= 3 && Math.abs(x) <= 2) type = 'C';
            v.push([x, y, z, type]);
          }
        }
      }
      // Snout & Nose
      v.push([0, 4, 3.5, 'B']);
      // Big Eyes
      v.push([-2.5, 3.5, 4.5, 'B'], [-2.5, 3.5, 5.5, 'B'], [-2.5, 3.5, 5.8, 'W']);
      v.push([2.5, 3.5, 4.5, 'B'], [2.5, 3.5, 5.5, 'B'], [2.5, 3.5, 5.8, 'W']);
      // Blush
      v.push([-3.5, 3.5, 3, 'P'], [3.5, 3.5, 3, 'P']);
      // Round Ears (z: 8..9, x: -3.5, 3.5)
      for (let z = 8; z <= 9; z++) {
        v.push([-3, 0, z, 'T'], [-3, 1, z, 'T']);
        v.push([3, 0, z, 'T'], [3, 1, z, 'T']);
      }
      // Paws resting over edge (z: 0..1, y: 3.5)
      v.push([-2, 3.5, 0.5, 'C'], [-3, 3.5, 0.5, 'C']);
      v.push([2, 3.5, 0.5, 'C'], [3, 3.5, 0.5, 'C']);
      return v;
    }

    const MODELS = [
      { id: 1, title: "Model 1: 3D Voxel Standing Chibi Otter", desc: "Isometric voxel sculpture with dimensional terracotta shading, cream snout & belly, sparkling eyes, and curved tail.", builder: buildModel1, size: 10.5, ox: 0, oy: 25 },
      { id: 2, title: "Model 2: 3D Voxel Holding Glowing Star", desc: "Sitting voxel companion holding a faceted glowing 3D star in its paws.", builder: buildModel2, size: 10.5, ox: 0, oy: 25 },
      { id: 3, title: "Model 3: 3D Voxel Floating Swimming Otter", desc: "Classic floating otter pose with folded tummy paws, relaxed head, and flipper feet.", builder: buildModel3, size: 11.5, ox: 0, oy: 15 },
      { id: 4, title: "Model 4: 3D Voxel Otter Companion Badge", desc: "Charming 3D voxel portrait with prominent ears, sparkly eyes, and cute paws resting in front.", builder: buildModel4, size: 11.5, ox: 0, oy: 20 },
    ];


    const grid = document.getElementById('grid');
    MODELS.forEach((m) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="header">
          <span class="num">0${m.id}</span>
          <h3>${m.title}</h3>
        </div>
        <div class="canvas-container">
          <canvas id="c${m.id}" width="500" height="320"></canvas>
        </div>
        <div class="footer-row">
          <p class="desc">${m.desc}</p>
          <div class="wordmark-tag">
            <span>sorro</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
      const canvas = document.getElementById(`c${m.id}`);
      const voxels = m.builder();
      renderModel(canvas, voxels, m.size, m.ox, m.oy);
    });
  </script>
</body>
</html>
