<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="slatePlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B2735"/>
      <stop offset="85%" stop-color="#181520"/>
      <stop offset="100%" stop-color="#0E0C13"/>
    </radialGradient>
    <linearGradient id="crispyFish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C2873E"/>
      <stop offset="40%" stop-color="#8E581D"/>
      <stop offset="80%" stop-color="#54300B"/>
      <stop offset="100%" stop-color="#2D1702"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#0C0B12"/>
  <circle cx="200" cy="150" r="140" fill="#14131D" opacity="0.8"/>

  <!-- Banana leaf lining -->
  <path d="M 60,190 Q 180,260 340,180 Q 370,120 320,70 Q 180,40 70,100 Z" fill="#2E5A27" opacity="0.55"/>

  <!-- Serving Plate -->
  <ellipse cx="200" cy="150" rx="140" ry="110" fill="url(#slatePlate)" filter="url(#shadow)" stroke="#474154" stroke-width="2.5"/>

  <!-- Golden Crispy Fried Tilapia / Bangus Fish -->
  <g filter="url(#shadow)">
    <!-- Main Body & Tail -->
    <path d="M 90,145 C 130,105 240,100 290,140 L 325,120 L 320,165 L 325,180 L 290,160 C 240,195 130,190 90,155 Z" fill="url(#crispyFish)"/>

    <!-- Head & Gills -->
    <path d="M 90,155 C 110,140 115,160 120,175" stroke="#422405" stroke-width="3" fill="none"/>
    <circle cx="108" cy="142" r="4.5" fill="#1C1004"/>
    <circle cx="109" cy="141" r="1.5" fill="#FFF"/>

    <!-- Diagonal deep-fry diagonal slits across body -->
    <g stroke="#381903" stroke-width="3.5" stroke-linecap="round">
      <line x1="150" y1="125" x2="175" y2="175"/>
      <line x1="185" y1="120" x2="210" y2="175"/>
      <line x1="220" y1="122" x2="245" y2="172"/>
      <line x1="255" y1="128" x2="275" y2="168"/>
    </g>

    <!-- Crispy golden skin highlights -->
    <g stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 145,120 Q 190,110 240,118"/>
      <path d="M 155,145 Q 200,135 250,142"/>
    </g>

    <!-- Dorsal and Ventral Fins -->
    <path d="M 170,108 Q 210,95 245,110 Z" fill="#6B3C0E"/>
    <path d="M 180,188 Q 215,200 245,185 Z" fill="#6B3C0E"/>
  </g>

  <!-- Calamansi & Soy-Vinegar dipping saucer (Toyomansi) -->
  <circle cx="85" cy="215" r="24" fill="#1E1C26" stroke="#484457" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="85" cy="215" r="18" fill="#1F1A24"/>
  <!-- Calamansi half floating -->
  <circle cx="85" cy="215" r="11" fill="#84CC16" stroke="#4D7C0F" stroke-width="1.5"/>
  <circle cx="85" cy="215" r="8" fill="#BEF264"/>
  <!-- Siling Labuyo red chili floating -->
  <path d="M 75,205 Q 82,208 86,212" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
