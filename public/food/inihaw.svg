<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="slate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C2A36"/>
      <stop offset="90%" stop-color="#15141C"/>
      <stop offset="100%" stop-color="#0E0D14"/>
    </radialGradient>
    <linearGradient id="charMeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D3B1B"/>
      <stop offset="40%" stop-color="#54210D"/>
      <stop offset="80%" stop-color="#2B1006"/>
      <stop offset="100%" stop-color="#120602"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#0C0B12"/>

  <!-- Platter plate -->
  <rect x="50" y="45" width="300" height="210" rx="24" fill="url(#slate)" filter="url(#shadow)" stroke="#433F52" stroke-width="2.5"/>
  <rect x="65" y="60" width="270" height="180" rx="16" fill="none" stroke="#2B2838" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Bamboo skewers sticks -->
  <line x1="70" y1="90" x2="330" y2="90" stroke="#D7BA89" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="330" y2="150" stroke="#D7BA89" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="70" y1="210" x2="330" y2="210" stroke="#D7BA89" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Inihaw Pork BBQ Skewers (Charred meat chunks) -->
  <g filter="url(#shadow)">
    <!-- Skewer 1 -->
    <rect x="110" y="74" width="45" height="32" rx="10" fill="url(#charMeat)"/>
    <rect x="160" y="72" width="48" height="36" rx="12" fill="url(#charMeat)"/>
    <rect x="215" y="74" width="46" height="32" rx="10" fill="url(#charMeat)"/>
    <rect x="268" y="76" width="38" height="28" rx="8" fill="url(#charMeat)"/>

    <!-- Skewer 2 -->
    <rect x="105" y="132" width="50" height="36" rx="12" fill="url(#charMeat)"/>
    <rect x="162" y="130" width="52" height="40" rx="14" fill="url(#charMeat)"/>
    <rect x="220" y="132" width="48" height="36" rx="12" fill="url(#charMeat)"/>
    <rect x="272" y="135" width="40" height="30" rx="9" fill="url(#charMeat)"/>

    <!-- Skewer 3 -->
    <rect x="115" y="195" width="44" height="30" rx="10" fill="url(#charMeat)"/>
    <rect x="164" y="192" width="50" height="36" rx="12" fill="url(#charMeat)"/>
    <rect x="218" y="194" width="46" height="32" rx="10" fill="url(#charMeat)"/>
    <rect x="270" y="196" width="38" height="28" rx="8" fill="url(#charMeat)"/>
  </g>

  <!-- Sweet Savory BBQ Glaze & Char Marks -->
  <g stroke="#100704" stroke-width="3.5" stroke-linecap="round">
    <line x1="125" y1="80" x2="138" y2="100"/>
    <line x1="180" y1="78" x2="195" y2="102"/>
    <line x1="235" y1="80" x2="245" y2="100"/>

    <line x1="120" y1="138" x2="135" y2="162"/>
    <line x1="182" y1="135" x2="198" y2="165"/>
    <line x1="240" y1="140" x2="252" y2="160"/>

    <line x1="130" y1="200" x2="142" y2="220"/>
    <line x1="185" y1="198" x2="198" y2="222"/>
  </g>

  <!-- Sweet Glossy Glaze Sheen -->
  <g stroke="#FFA352" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M 118,84 Q 135,78 148,88"/>
    <path d="M 170,82 Q 190,76 202,86"/>
    <path d="M 115,142 Q 135,136 150,146"/>
    <path d="M 172,140 Q 195,134 208,144"/>
    <path d="M 125,204 Q 142,198 152,208"/>
  </g>

  <!-- Calamansi slice & Chili garnish -->
  <circle cx="88" cy="225" r="16" fill="#84CC16" stroke="#4D7C0F" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="88" cy="225" r="12" fill="#BEF264"/>
  <polygon points="88,225 84,215 88,214" fill="#4D7C0F" opacity="0.5"/>
  <polygon points="88,225 98,220 97,225" fill="#4D7C0F" opacity="0.5"/>
</svg>
