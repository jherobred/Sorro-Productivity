<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="soupBowl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#282430"/>
      <stop offset="85%" stop-color="#18151F"/>
      <stop offset="100%" stop-color="#0E0D14"/>
    </radialGradient>
    <radialGradient id="broth" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#A28858"/>
      <stop offset="60%" stop-color="#6F522E"/>
      <stop offset="100%" stop-color="#4E341B"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#0C0B12"/>
  <circle cx="200" cy="150" r="140" fill="#14131D" opacity="0.8"/>

  <!-- Bowl rim and shadow -->
  <ellipse cx="200" cy="150" rx="135" ry="120" fill="url(#soupBowl)" filter="url(#shadow)" stroke="#4A455A" stroke-width="3"/>
  <ellipse cx="200" cy="150" rx="122" ry="108" fill="none" stroke="#332F42" stroke-width="2"/>

  <!-- Sour Tamarind Broth -->
  <ellipse cx="200" cy="150" rx="112" ry="98" fill="url(#broth)"/>

  <!-- Pork Belly Cut (Liempo) -->
  <g filter="url(#shadow)">
    <path d="M 160,110 C 185,105 210,110 225,130 C 220,150 190,155 165,145 C 145,135 150,115 160,110 Z" fill="#D3A27F"/>
    <path d="M 165,115 C 185,112 205,116 218,132" stroke="#F1D1B8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 162,122 C 182,120 198,124 212,138" stroke="#88422A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Kangkong greens -->
  <g filter="url(#shadow)">
    <path d="M 115,135 Q 130,115 155,125 Q 145,150 120,145 Z" fill="#2E7D32"/>
    <path d="M 125,160 Q 150,140 170,165 Q 145,180 125,160 Z" fill="#388E3C"/>
    <path d="M 220,160 Q 255,145 270,170 Q 240,190 220,160 Z" fill="#2E7D32"/>
  </g>

  <!-- Tomato Wedges (Kamatis) -->
  <g filter="url(#shadow)">
    <path d="M 230,120 C 250,110 265,125 255,145 C 240,150 225,135 230,120 Z" fill="#E53935"/>
    <circle cx="242" cy="132" r="3" fill="#FFE082"/>
  </g>

  <!-- Radish slices (Labanos) -->
  <ellipse cx="140" cy="180" rx="16" ry="12" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1.5" transform="rotate(-15 140 180)" filter="url(#shadow)"/>
  <ellipse cx="180" cy="195" rx="18" ry="14" fill="#F1F8E9" stroke="#DCEDC8" stroke-width="1.5" transform="rotate(10 180 195)" filter="url(#shadow)"/>

  <!-- Long Green Pepper (Siling Haba) -->
  <path d="M 130,105 Q 180,85 240,95 Q 260,100 280,90" fill="none" stroke="#43A047" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 280,90 L 290,85" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
</svg>
