<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorro</title>
<style>
  :root { color-scheme: dark; --bg: #07060d; --tx: #f2f1f6; --tx2: #a9a7b4; --btn: #f2f1f6; --btn-tx: #07060d; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f7f6fa; --tx: #15141b; --tx2: #5d5b68; --btn: #15141b; --btn-tx: #f7f6fa; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: var(--bg); color: var(--tx); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
  p { margin: 0 auto 20px; max-width: 30ch; color: var(--tx2); }
  button { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-tx); font: inherit; font-weight: 650; }
</style>
</head>
<body>
<main>
  <h1>sorro</h1>
  <p>Connect to the internet once so Sorro can save itself for offline use.</p>
  <button type="button" onclick="location.replace('https://basedly-web-jhemsini.vercel.app/')">Try again</button>
</main>
</body>
</html>
